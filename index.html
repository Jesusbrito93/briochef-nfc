<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Briochef — Desde 2020</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #F5E2C4;
      --orange: #E8870F;
      --orange-light: #F5A623;
      --brown-dark: #1E1108;
      --brown: #3A2215;
      --brown-mid: #5C3A22;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      font-family: 'DM Sans', sans-serif;
    }

    body {
      background: var(--brown-dark);
      background-image:
        radial-gradient(ellipse at 50% 0%, rgba(232,135,15,0.12) 0%, transparent 60%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 2rem 1.5rem;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }

    /* ── Logo ── */
    .logo-wrap {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(245,226,196,0.08) 0%, transparent 70%);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.6s ease-out;
    }

    .logo-wrap img {
      width: 140px;
      height: 140px;
      object-fit: contain;
      filter: drop-shadow(0 4px 24px rgba(232,135,15,0.3));
    }

    /* ── Tagline ── */
    .tagline {
      text-align: center;
      animation: fadeIn 0.6s ease-out 0.15s both;
    }

    .tagline h1 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--cream);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .tagline .divider {
      width: 48px;
      height: 2px;
      background: var(--orange);
      margin: 0.5rem auto;
      border-radius: 1px;
    }

    .tagline p {
      font-size: 0.85rem;
      color: var(--brown-mid);
      font-weight: 500;
      letter-spacing: 0.05em;
    }

    /* ── Buttons ── */
    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      animation: slideUp 0.5s ease-out 0.3s both;
    }

    .link-btn {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      width: 100%;
      padding: 1rem 1.25rem;
      border-radius: 14px;
      text-decoration: none;
      font-size: 1rem;
      font-weight: 700;
      transition: transform 0.15s ease, box-shadow 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .link-btn:active {
      transform: scale(0.97);
    }

    .link-btn .icon {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      flex-shrink: 0;
    }

    /* Variant: Primary (orange solid) */
    .link-btn.primary {
      background: var(--orange);
      color: var(--brown-dark);
      box-shadow: 0 4px 20px rgba(232,135,15,0.3);
    }
    .link-btn.primary .icon {
      background: rgba(30,17,8,0.15);
    }

    /* Variant: Outline (cream border) */
    .link-btn.outline {
      background: rgba(245,226,196,0.06);
      color: var(--cream);
      border: 1.5px solid rgba(245,226,196,0.18);
    }
    .link-btn.outline .icon {
      background: rgba(245,226,196,0.08);
    }

    /* Variant: Warm (subtle brown) */
    .link-btn.warm {
      background: var(--brown);
      color: var(--cream);
      border: 1.5px solid rgba(245,226,196,0.08);
    }
    .link-btn.warm .icon {
      background: rgba(232,135,15,0.15);
    }

    /* ── Footer ── */
    .footer {
      margin-top: 1rem;
      text-align: center;
      animation: fadeIn 0.5s ease-out 0.45s both;
    }

    .footer span {
      font-size: 0.7rem;
      color: rgba(245,226,196,0.2);
      letter-spacing: 0.08em;
      font-weight: 500;
    }

    /* ── Animations ── */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* Taller phones get more breathing room */
    @media (min-height: 740px) {
      .container { gap: 2.5rem; }
    }
  </style>
</head>
<body>

  <div class="container">

    <div class="logo-wrap">
      <img src="logo.png" alt="Briochef — Desde 2020">
    </div>

    <div class="tagline">
      <h1>Briochef</h1>
      <div class="divider"></div>
      <p>Madrid · Desde 2020</p>
    </div>

    <nav class="links">
      <a href="https://briochef.com/" class="link-btn primary" target="_blank" rel="noopener">
        <span class="icon">🌐</span>
        Nuestra web
      </a>
      <a href="https://briochef.com/nuestro-menu/" class="link-btn outline" target="_blank" rel="noopener">
        <span class="icon">📖</span>
        Carta
      </a>
      <a href="https://briochef.com/pedidos-briochef/" class="link-btn primary" target="_blank" rel="noopener">
        <span class="icon">🛵</span>
        Pedir
      </a>
      <a href="https://www.google.com/maps/search/Briochef+Madrid" class="link-btn warm" target="_blank" rel="noopener">
        <span class="icon">📍</span>
        Cómo llegar
      </a>
    </nav>

    <div class="footer">
      <span>🔥 Hecho con fuego</span>
    </div>

  </div>

</body>
</html>
